<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#065f46">
  <meta name="description" content="Centro local de estudos para concursos de Defensoria Pública.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Centro de Estudos — Defensoria Pública</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="top">
      <div class="brand" aria-label="Centro de Estudos para Defensoria Pública">
        <span class="brand-mark" aria-hidden="true">DP</span>
        <span><b>Centro de Estudos</b><small id="brandContext">DPE / Rio Grande do Norte</small></span>
      </div>
      <div class="exam-context">
        <label class="profile-control"><span>Concurso</span><select id="profileSelect" aria-label="Selecionar concurso"><option value="RN">DPE/RN</option><option value="SP">DPE/SP</option></select></label>
        <span class="chip" id="chipProva"></span>
        <span class="chip" id="chipBanca"></span>
      </div>
      <nav class="tabs" id="tabs" aria-label="Áreas do centro de estudos"></nav>
      <div class="side-foot">
        <small>Planejamento local e seguro</small>
        <button class="btn side-theme sm" id="btnTheme" title="Alternar tema" aria-label="Alternar tema">Alternar tema</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <section class="boot" aria-live="polite">
        <div class="boot-seal">DP</div>
        <p>Preparando sua mesa de estudos…</p>
      </section>
    </main>
  </div>
  <noscript>Ative o JavaScript para utilizar o Centro de Estudos.</noscript>
  <script src="./app.js" defer></script>
</body>
</html>

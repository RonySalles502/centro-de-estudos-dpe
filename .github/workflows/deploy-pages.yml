name: Publicar PWA e atualizar jurisprudência

on:
  push:
    branches: [main, master]
    paths:
      - "pwa/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # 06:17 em Fortaleza. Minuto não redondo reduz atrasos em horários de pico.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Atualizar jurisprudência oficial
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 pwa/update_jurisprudence.py

      - name: Executar testes de domínio e atualização
        run: python3 -m unittest discover -v

      - name: Gerar site estático e validar conteúdo
        run: python3 pwa/build.py

      - name: Preservar a última coleta válida no repositório
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/content/jurisprudence.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(content): atualiza jurisprudência [skip ci]"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
